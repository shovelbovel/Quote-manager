{% extends 'base.html' %}

{% block title %}Register - QuoteManager{% endblock %}

{% block content %}
<div class="register-page" style="max-width: 600px; margin: 0 auto;">
    <div class="card">
        <div class="card-header" style="text-align: center;">
            <h2 style="margin: 0;">Create an Account</h2>
        </div>
        <div class="card-body">
            <form method="post" action="{% url 'register' %}" data-validate>
                {% csrf_token %}
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                    <div class="form-group">
                        <label for="username" class="form-label">Username *</label>
                        <input type="text" name="username" id="username" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email" class="form-label">Email *</label>
                        <input type="email" name="email" id="email" class="form-control" required>
                    </div>
                </div>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                    <div class="form-group">
                        <label for="password" class="form-label">Password *</label>
                        <input type="password" name="password" id="password" class="form-control" required data-password-validate>
                        <small class="form-text text-muted">Password must be at least 8 characters long.</small>
                    </div>
                    
                    <div class="form-group">
                        <label for="password_confirm" class="form-label">Confirm Password *</label>
                        <input type="password" name="password_confirm" id="password_confirm" class="form-control" required>
                    </div>
                </div>
                
                <div style="margin-top: 1rem;">
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Register</button>
                </div>
            </form>
        </div>
        <div class="card-footer" style="text-align: center;">
            <p style="margin: 0;">Already have an account? <a href="{% url 'login' %}">Login here</a></p>
        </div>
    </div>
</div>
{% endblock %}
