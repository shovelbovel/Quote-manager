{% extends 'base.html' %}

{% block title %}Edit User - QuoteManager{% endblock %}

{% block content %}
<div class="admin-edit-user-page">
    <h1>Edit User: {{ user.username }}</h1>
    
    <form method="post" action="{% url 'edit-user-page' user.id %}" data-validate>
        {% csrf_token %}
        
        <div class="form-group">
            <label for="username" class="form-label">Username *</label>
            <input type="text" name="username" id="username" class="form-control" value="{{ user.username }}" required>
        </div>
        
        <div class="form-group">
            <label for="email" class="form-label">Email *</label>
            <input type="email" name="email" id="email" class="form-control" value="{{ user.email }}" required>
        </div>
        
        <div class="form-group">
            <label for="first_name" class="form-label">First Name</label>
            <input type="text" name="first_name" id="first_name" class="form-control" value="{{ user.first_name }}">
        </div>
        
        <div class="form-group">
            <label for="last_name" class="form-label">Last Name</label>
            <input type="text" name="last_name" id="last_name" class="form-control" value="{{ user.last_name }}">
        </div>
        
        <div class="form-check">
            <input type="checkbox" class="form-check-input" id="is_staff" name="is_staff" {% if user.is_staff %}checked{% endif %}>
            <label class="form-check-label" for="is_staff">Give admin privileges</label>
        </div>
        
        <div class="form-check">
            <input type="checkbox" class="form-check-input" id="is_active" name="is_active" {% if user.is_active %}checked{% endif %}>
            <label class="form-check-label" for="is_active">Active</label>
        </div>
        
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{% url 'admin_dashboard' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
