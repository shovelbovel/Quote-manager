{% extends 'base.html' %}

{% block title %}Edit Service - QuoteManager{% endblock %}

{% block content %}
<div class="admin-edit-service-page">
    <h1>Edit Service: {{ service.name }}</h1>
    
    <form action="{% url 'edit-service-page' service.id %}" method="post" data-validate>
        {% csrf_token %}
        
        <div class="form-group">
            <label for="name" class="form-label">Service Name *</label>
            <input type="text" name="name" id="name" class="form-control" value="{{ service.name }}" required>
        </div>
        
        <div class="form-group">
            <label for="description" class="form-label">Description</label>
            <textarea name="description" id="description" class="form-control" rows="3">{{ service.description }}</textarea>
        </div>
        
        <div class="form-group">
            <label for="unit_price" class="form-label">Unit Price *</label>
            <input type="number" step="0.01" min="0" name="unit_price" id="unit_price" class="form-control" value="{{ service.unit_price }}" required>
        </div>
        
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{% url 'admin_services' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
