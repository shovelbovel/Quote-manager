{% extends 'base.html' %}

{% block title %}Create New User - QuoteManager{% endblock %}

{% block content %}
<div class="admin-create-user-page">
    <h1>Create New User</h1>
    
    <form action="{% url 'create-user-page' %}" method="post" data-validate>
        {% csrf_token %}
        
        <div class="form-group">
            <label for="username" class="form-label">Username *</label>
            <input type="text" name="username" id="username" class="form-control" required>
        </div>
        
        <div class="form-group">
            <label for="email" class="form-label">Email *</label>
            <input type="email" name="email" id="email" class="form-control" required>
        </div>
        
        <div class="form-group">
            <label for="first_name" class="form-label">First Name</label>
            <input type="text" name="first_name" id="first_name" class="form-control">
        </div>
        
        <div class="form-group">
            <label for="last_name" class="form-label">Last Name</label>
            <input type="text" name="last_name" id="last_name" class="form-control">
        </div>
        
        <div class="form-group">
            <label for="password" class="form-label">Password *</label>
            <input type="password" name="password" id="password" class="form-control" required data-password-validate>
        </div>
        
        <div class="form-group">
            <label for="password_confirm" class="form-label">Confirm Password *</label>
            <input type="password" name="password_confirm" id="password_confirm" class="form-control" required>
        </div>
        
        <div class="form-group">
            <label>
                <input type="checkbox" name="is_staff"> Give admin privileges
            </label>
        </div>
        
        <button type="submit" class="btn btn-primary">Create User</button>
        <a href="{% url 'admin_dashboard' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
