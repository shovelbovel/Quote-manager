{% extends 'base.html' %}

{% block title %}Login - QuoteManager{% endblock %}

{% block content %}
<div class="login-page" style="max-width: 500px; margin: 0 auto;">
    <div class="card">
        <div class="card-header" style="text-align: center;">
            <h2 style="margin: 0;">Login to Your Account</h2>
        </div>
        <div class="card-body">
            <form method="post" action="{% url 'login' %}" data-validate>
                {% csrf_token %}
                
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" name="username" id="username" class="form-control" required autofocus>
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" name="password" id="password" class="form-control" required>
                </div>
                
                <div style="margin-bottom: 1rem;">
                    <a href="#" style="font-size: 0.875rem;">Forgot password?</a>
                </div>
                
                <div style="margin-bottom: 1rem;">
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
                </div>
                
                {% if next %}
                    <input type="hidden" name="next" value="{{ next }}">
                {% endif %}
            </form>
        </div>
        <div class="card-footer" style="text-align: center;">
            <p style="margin: 0;">Don't have an account? <a href="{% url 'register' %}">Register now</a></p>
        </div>
    </div>
</div>
{% endblock %}
