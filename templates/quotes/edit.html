{% extends 'base.html' %}
{% load static %}
{% block title %}Edit Quote - QuoteManager{% endblock %}

{% block content %}
<div class="quote-edit-page">
    <div style="margin-bottom: 1rem;">
        <a href="{% url 'quote_list' %}" class="btn btn-sm btn-outline">
            <i class="fas fa-arrow-left"></i> Back to Quotes
        </a>
    </div>
    
    <h1>Edit Quote</h1>
    
    <form method="post" action="{% url 'quote_edit' quote.slug %}" class="quote-items-form" data-validate>
        {% csrf_token %}
        
        <!-- Basic Information -->
        <div class="card" style="margin-top: 1.5rem;">
            <div class="card-header">
                <h3 style="margin: 0;">Basic Information</h3>
            </div>
            <div class="card-body">
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem;">
                    <div class="form-group">
                        <label for="title" class="form-label">Quote Title *</label>
                        <input type="text" name="title" id="title" class="form-control" value="{{ quote.title }}" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="valid_until" class="form-label">Valid Until *</label>
                        <input type="date" name="valid_until" id="valid_until" class="form-control" value="{{ quote.valid_until|date:'Y-m-d' }}" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="description" class="form-label">Description</label>
                    <textarea name="description" id="description" class="form-control" rows="3">{{ quote.description }}</textarea>
                </div>
            </div>
        </div>
        
        <!-- Client Information -->
        <div class="card" style="margin-top: 1.5rem;">
            <div class="card-header">
                <h3 style="margin: 0;">Client Information</h3>
            </div>
            <div class="card-body">
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem;">
                    <div class="form-group">
                        <label for="client_name" class="form-label">Client Name *</label>
                        <input type="text" name="client_name" id="client_name" class="form-control" value="{{ quote.client_name }}" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="client_email" class="form-label">Client Email *</label>
                        <input type="email" name="client_email" id="client_email" class="form-control" value="{{ quote.client_email }}" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="client_address" class="form-label">Client Address</label>
                    <textarea name="client_address" id="client_address" class="form-control" rows="3">{{ quote.client_address }}</textarea>
                </div>
            </div>
        </div>
        
        <!-- Status -->
        <div class="card" style="margin-top: 1.5rem;">
            <div class="card-header">
                <h3 style="margin: 0;">Status</h3>
            </div>
            <div class="card-body">
                <div class="form-group">
                    <label for="status" class="form-label">Status</label>
                    <select name="status" id="status" class="form-select">
                        <option value="pending" {% if quote.status == 'pending' %}selected{% endif %}>Pending</option>
                        <option value="accepted" {% if quote.status == 'accepted' %}selected{% endif %}>Accepted</option>
                        <option value="refused" {% if quote.status == 'refused' %}selected{% endif %}>Refused</option>
                    </select>
                </div>
            </div>
        </div>
        
        <!-- Items -->
        <div class="card" style="margin-top: 1.5rem;">
            <div class="card-header">
                <h3 style="margin: 0;">Items</h3>
            </div>
            <div class="card-body">
                <div class="items-container">
                  <!-- Items will be added here -->
                </div>

                <button type="button" class="btn btn-outline add-item-btn">
                    <i class="fas fa-plus"></i> Add Item
                </button>
            </div>
        </div>
        
        <!-- Submit Buttons -->
        <div style="margin-top: 2rem; display: flex; justify-content: flex-end; gap: 1rem;">
            <a href="{% url 'quote_list' %}" class="btn btn-outline">Cancel</a>
            <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
    </form>
</div>

<template id="item-template">
    <div class="item-row" style="display: grid; grid-template-columns: 2fr 3fr 1fr 1fr 1fr auto; gap: 1rem; margin-bottom: 1rem; align-items: center;">
        <div>
            <select name="item_service" class="form-select item-service" required>
                <option value="">Select a service</option>
                {% for service in services %}
                    <option value="{{ service.id }}" data-price="{{ service.unit_price }}">{{ service.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <input type="text" name="item_description" class="form-control" placeholder="Description">
        </div>
        <div>
            <input type="number" name="item_quantity" class="form-control item-quantity" value="1" min="1" step="1" required>
        </div>
        <div>
            <input type="number" step="0.01" name="item_price" class="form-control item-price" placeholder="0.00" required>
        </div>
        <div>
            $<span class="item-total">0.00</span>
        </div>
        <div>
            <button type="button" class="btn btn-sm btn-danger remove-item-btn">
                <i class="fas fa-trash"></i>
            </button>
        </div>
    </div>
</template>
{% endblock %}

{% block extra_js %}

<script src="{% static 'js/main.js' %}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Initialize the quote items functionality
        if (typeof initializeQuoteItems === 'function') {
            initializeQuoteItems();
        } else {
            console.error('initializeQuoteItems() is not defined!');
        }

        // Pre-populate existing items
        const itemsContainer = document.querySelector('.items-container');
        const itemTemplate = document.getElementById('item-template');
        
        {% for item in quote.items.all %}
            const newItem = itemTemplate.content.cloneNode(true);
            const row = newItem.querySelector('.item-row');
            
            // Set values for the item
            const serviceSelect = row.querySelector('.item-service');
            if (serviceSelect) {
                serviceSelect.value = '{{ item.service.id }}';
                // Trigger change to update price
                const event = new Event('change');
                serviceSelect.dispatchEvent(event);
            }
            
            const descriptionInput = row.querySelector('input[name="item_description"]');
            if (descriptionInput) {
                descriptionInput.value = '{{ item.description|escapejs }}';
            }
            
            const quantityInput = row.querySelector('.item-quantity');
            if (quantityInput) {
                quantityInput.value = '{{ item.quantity }}';
            }
            
            const priceInput = row.querySelector('.item-price');
            if (priceInput) {
                priceInput.value = '{{ item.unit_price|floatformat:2 }}';
            }
            
            // Add to container
            itemsContainer.appendChild(newItem);
            
            // Update total after adding the item
            if (typeof updateQuoteTotals === 'function') {
                updateQuoteTotals();
            }
        {% endfor %}
    });
</script>
{% endblock %}
